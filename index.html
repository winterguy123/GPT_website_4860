<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upskilling in Cybersecurity - Project Charter (Enhanced)</title>
  <style>
    /* ---------- EXISTING STYLES ---------- */
    :root {
      --bg: #0a0e1a;
      --card: #0f1419;
      --card-elevated: #151b26;
      --muted: #7c8b9e;
      --text: #e8f0fa;
      --text-secondary: #b8c4d0;
      --brand: #4ade80;
      --brand-2: #3b82f6;
      --accent: #f59e0b;
      --success: #22c55e;
      --danger: #ef4444;
      --info: #06b6d4;
      --warning: #eab308;
      --shadow-sm: 0 2px 8px rgba(0,0,0,.15);
      --shadow: 0 8px 25px rgba(0,0,0,.25), 0 3px 10px rgba(0,0,0,.1);
      --shadow-lg: 0 20px 40px rgba(0,0,0,.4), 0 8px 16px rgba(0,0,0,.2);
      --radius-xl: 20px;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --ring: 0 0 0 3px rgba(74,222,128,.2);
      --border: rgba(255,255,255,.08);
      --border-strong: rgba(255,255,255,.15);
    }

    /* ---------- NEW: Reading progress bar ---------- */
    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--brand), var(--brand-2));
      width: 0%;
      z-index: 100;
      transition: width 0.15s ease-out;
    }

    /* ---------- NEW: Section fade-in animation ---------- */
    .fade-section {
      opacity: 0;
      transform: translateY(25px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .fade-section.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <!-- NEW: Reading progress bar -->
  <div id="progress-bar"></div>

  <!-- EXISTING topbar -->
  <div class="topbar">
    <div class="inner">
      <div class="logo" aria-label="Upskilling in Cybersecurity">
        <div class="badge">🔒</div>
        <div>Upskilling in Cybersecurity</div>
      </div>
      <div class="top-actions">
        <button class="btn" id="expandAll" title="Expand all sections">Expand all</button>
        <button class="btn" id="collapseAll" title="Collapse all sections">Collapse all</button>
        <button class="btn" id="themeToggle" title="Toggle theme">Toggle theme</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <aside class="side" aria-label="On this page">
      <div class="toc-head">Table of Contents</div>
      <ul class="toc" id="toc"></ul>
    </aside>

    <!-- Apply fade-in class to container -->
    <main class="container fade-section" id="main">
      <header class="header fade-section">
        <h1>Upskilling in cybersecurity</h1>
        <p>Project Charter - Managing IT Projects Course</p>
      </header>

      <div class="content">
        <!-- Example: Student Information -->
        <section class="student-info fade-section" id="student-info">
          <h3>Student Information</h3>
          <!-- content stays the same -->
        </section>

        <!-- Add fade-section class to each details -->
        <details class="section fade-section" id="sec-1" open>
          <summary class="section-header"><span class="chev">▶</span><h2 class="section-title">📋 1. Project Title & Description</h2></summary>
          <div class="section-content"> ... </div>
        </details>

        <details class="section fade-section" id="sec-2">
          <summary class="section-header"><span class="chev">▶</span><h2 class="section-title">🎯 2. Vision, Mission & Strategy Alignment</h2></summary>
          <div class="section-content"> ... </div>
        </details>

        <!-- repeat fade-section for other details ... -->

      </div>
    </main>
  </div>

  <div class="page-actions">
    <div class="action-bar">
      <a class="btn" href="#main" title="Back to top">Back to top</a>
      <button class="btn" id="printBtn" title="Print or save as PDF">Print</button>
    </div>
  </div>

  <script>
    /* ---------- EXISTING SCRIPT (unchanged) ---------- */
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('light');
      const isLight = document.documentElement.classList.contains('light');
      themeToggle.textContent = isLight ? 'Dark mode' : 'Light mode';
      try { localStorage.setItem('theme', isLight ? 'light' : 'dark'); } catch(e) {}
    });
    (function(){
      try {
        const saved = localStorage.getItem('theme');
        if(saved === 'light') {
          document.documentElement.classList.add('light');
          themeToggle.textContent = 'Dark mode';
        } else { themeToggle.textContent = 'Light mode'; }
      } catch(e) { themeToggle.textContent = 'Light mode'; }
    })();

    const allDetails = () => Array.from(document.querySelectorAll('details.section'));
    const expandBtn = document.getElementById('expandAll');
    const collapseBtn = document.getElementById('collapseAll');
    expandBtn.addEventListener('click', () => {
      allDetails().forEach(d => d.open = true);
      expandBtn.textContent = 'All expanded';
      setTimeout(() => expandBtn.textContent = 'Expand all', 1500);
    });
    collapseBtn.addEventListener('click', () => {
      allDetails().forEach(d => d.open = false);
      collapseBtn.textContent = 'All collapsed';
      setTimeout(() => collapseBtn.textContent = 'Collapse all', 1500);
    });
    document.getElementById('printBtn').addEventListener('click', () => {
      const wasOpen = allDetails().map(d => d.open);
      allDetails().forEach(d => d.open = true);
      window.print();
      setTimeout(() => {
        allDetails().forEach((d, i) => d.open = wasOpen[i]);
      }, 100);
    });

    const toc = document.getElementById('toc');
    const headings = Array.from(document.querySelectorAll('details.section .section-title'));
    headings.forEach((h, i) => {
      const parentDetails = h.closest('details.section');
      const id = parentDetails.id || `sec-${i+1}`;
      parentDetails.id = id;
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = `#${id}`;
      a.textContent = h.textContent.trim();
      a.addEventListener('click', () => setTimeout(() => { parentDetails.open = true; }, 100));
      li.appendChild(a);
      toc.appendChild(li);
    });

    const links = Array.from(toc.querySelectorAll('a'));
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const idx = headings.findIndex(h => h.closest('details.section').id === entry.target.id);
        if (idx > -1) {
          const link = links[idx];
          if (entry.isIntersecting) link.classList.add('active');
          else link.classList.remove('active');
        }
      });
    }, { rootMargin: '-20% 0px -70% 0px', threshold: [0, 0.1, 0.5, 1] });
    document.querySelectorAll('details.section').forEach(sec => observer.observe(sec));

    document.querySelectorAll('summary.section-header').forEach(sum => {
      sum.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          sum.parentElement.open = !sum.parentElement.open;
        }
      });
    });

    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
    });

    document.addEventListener('DOMContentLoaded', () => {
      document.body.style.opacity = '0';
      document.body.style.transform = 'translateY(20px)';
      document.body.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
      setTimeout(() => {
        document.body.style.opacity = '1';
        document.body.style.transform = 'translateY(0)';
      }, 100);
    });

    /* ---------- NEW: Progress bar scroll ---------- */
    const progressBar = document.getElementById('progress-bar');
    window.addEventListener('scroll', () => {
      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const progress = (scrollTop / docHeight) * 100;
      progressBar.style.width = progress + '%';
    });

    /* ---------- NEW: Fade-in sections ---------- */
    const fadeSections = document.querySelectorAll('.fade-section');
    const fadeObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.2 });
    fadeSections.forEach(sec => fadeObserver.observe(sec));
  </script>
</body>
</html>
