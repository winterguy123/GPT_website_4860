<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upskilling in Cybersecurity - Project Charter (Enhanced)</title>
  <style>
    :root {
      --bg: #0a0e1a;
      --card: #0f1419;
      --card-elevated: #151b26;
      --muted: #7c8b9e;
      --text: #e8f0fa;
      --text-secondary: #b8c4d0;
      --brand: #4ade80;
      --brand-2: #3b82f6;
      --accent: #f59e0b;
      --shadow-sm: 0 2px 8px rgba(0,0,0,.15);
      --shadow: 0 8px 25px rgba(0,0,0,.25);
      --radius-lg: 16px;
    }

    #progress-bar {
      position: fixed;
      top: 0; left: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--brand), var(--brand-2));
      width: 0%;
      z-index: 100;
      transition: width 0.15s ease-out;
    }

    .fade-section {
      opacity: 0;
      transform: translateY(25px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .fade-section.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ---------- NEW INTERACTIVE: Smooth section expand ---------- */
    details.section[open] .section-content {
      animation: expand 0.4s ease;
    }
    @keyframes expand {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ---------- NEW INTERACTIVE: TOC highlight ---------- */
    .toc a {
      position: relative;
      text-decoration: none;
      transition: color 0.3s ease;
    }
    .toc a.active::after {
      content: '';
      position: absolute;
      bottom: -2px; left: 0;
      width: 100%; height: 2px;
      background: linear-gradient(90deg, var(--brand), var(--brand-2));
      animation: slideIn 0.3s forwards;
    }
    @keyframes slideIn {
      from { width: 0; }
      to { width: 100%; }
    }

    /* ---------- NEW INTERACTIVE: Scroll-to-top ---------- */
    #scrollTopBtn {
      position: fixed;
      bottom: 24px; right: 24px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #fff;
      border: none;
      padding: 12px 16px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      box-shadow: 0 6px 20px rgba(0,0,0,.3);
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      z-index: 200;
    }
    #scrollTopBtn.show {
      opacity: 1;
      visibility: visible;
    }

    /* ---------- NEW INTERACTIVE: Search box ---------- */
    #searchBox {
      width: 100%;
      padding: 8px 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid var(--muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="progress-bar"></div>

  <div class="topbar">
    <div class="inner">
      <div class="logo"><div class="badge">🔒</div>Upskilling in Cybersecurity</div>
      <div class="top-actions">
        <button class="btn" id="expandAll">Expand all</button>
        <button class="btn" id="collapseAll">Collapse all</button>
        <button class="btn" id="themeToggle">Toggle theme</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <aside class="side">
      <div class="toc-head">Table of Contents</div>
      <!-- NEW INTERACTIVE: search box -->
      <input type="text" id="searchBox" placeholder="Search sections... (press /)" />
      <ul class="toc" id="toc"></ul>
    </aside>

    <main class="container fade-section" id="main">
      <header class="header fade-section">
        <h1>Upskilling in cybersecurity</h1>
        <p>Project Charter - Managing IT Projects Course</p>
      </header>

      <div class="content">
        <details class="section fade-section" id="sec-1" open>
          <summary class="section-header"><h2 class="section-title">📋 1. Project Title & Description</h2></summary>
          <div class="section-content"> ... </div>
        </details>
        <details class="section fade-section" id="sec-2">
          <summary class="section-header"><h2 class="section-title">🎯 2. Vision, Mission & Strategy Alignment</h2></summary>
          <div class="section-content"> ... </div>
        </details>
        <!-- more sections ... -->
      </div>
    </main>
  </div>

  <!-- NEW INTERACTIVE: Scroll-to-top -->
  <button id="scrollTopBtn" title="Back to top">↑</button>

  <script>
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      document.documentElement.classList.toggle('light');
    });

    const allDetails = () => Array.from(document.querySelectorAll('details.section'));
    document.getElementById('expandAll').onclick = () => allDetails().forEach(d => d.open = true);
    document.getElementById('collapseAll').onclick = () => allDetails().forEach(d => d.open = false);

    // Progress bar
    const progressBar = document.getElementById('progress-bar');
    window.addEventListener('scroll', () => {
      const progress = (window.scrollY / (document.documentElement.scrollHeight - window.innerHeight)) * 100;
      progressBar.style.width = progress + '%';
    });

    // Fade-in
    const fadeSections = document.querySelectorAll('.fade-section');
    const fadeObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
    }, { threshold: 0.2 });
    fadeSections.forEach(sec => fadeObserver.observe(sec));

    // TOC build
    const toc = document.getElementById('toc');
    const headings = Array.from(document.querySelectorAll('details.section .section-title'));
    headings.forEach((h, i) => {
      const parentDetails = h.closest('details.section');
      const id = parentDetails.id || `sec-${i+1}`;
      parentDetails.id = id;
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = `#${id}`;
      a.textContent = h.textContent.trim();
      li.appendChild(a);
      toc.appendChild(li);
    });

    // Scroll-to-top
    const scrollTopBtn = document.getElementById('scrollTopBtn');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 300) scrollTopBtn.classList.add('show');
      else scrollTopBtn.classList.remove('show');
    });
    scrollTopBtn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });

    // Search functionality
    const searchBox = document.getElementById('searchBox');
    searchBox.addEventListener('input', () => {
      const query = searchBox.value.toLowerCase();
      headings.forEach(h => {
        const section = h.closest('details.section');
        section.style.display = h.textContent.toLowerCase().includes(query) ? '' : 'none';
      });
    });
    // Shortcut to focus search
    document.addEventListener('keydown', (e) => {
      if (e.key === '/') { e.preventDefault(); searchBox.focus(); }
      if (e.key.toLowerCase() === 't') themeToggle.click();
    });

    // Fun confetti when last section opens
    const lastSection = allDetails().slice(-1)[0];
    lastSection.addEventListener('toggle', () => {
      if (lastSection.open) {
        for (let i=0; i<20; i++) {
          const conf = document.createElement('div');
          conf.textContent = '🎉';
          conf.style.position = 'fixed';
          conf.style.left = Math.random()*100 + 'vw';
          conf.style.top = '-20px';
          conf.style.fontSize = '20px';
          conf.style.animation = `fall ${2+Math.random()*2}s linear forwards`;
          document.body.appendChild(conf);
          setTimeout(()=> conf.remove(), 4000);
        }
      }
    });
  </script>

  <style>
    /* simple confetti fall animation */
    @keyframes fall {
      to { transform: translateY(100vh); opacity: 0; }
    }
  </style>
</body>
</html>
